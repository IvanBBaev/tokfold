[workspace]
resolver = "3"
members = ["crates/tokfold-core", "crates/tokfold-cli", "crates/tokfold-mcp"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Ivan Baev <ivanbbaev@gmail.com>"]
description = "Reversible, structure-aware context compression for LLM agents"
keywords = ["llm", "compression", "tokens", "agent", "mcp"]
categories = ["compression", "text-processing"]
repository = "https://github.com/IvanBBaev/tokfold"
homepage = "https://github.com/IvanBBaev/tokfold"

[workspace.dependencies]
tokfold-core = { path = "crates/tokfold-core", version = "0.0.1" }
tokfold-mcp = { path = "crates/tokfold-mcp", version = "0.0.1" }
thiserror = "2"
sha2 = "0.10"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"

# `panic = "abort"` is deliberately NOT set: the MCP proxy relies on
# `catch_unwind` as a last-resort bulkhead so a panic cannot kill the agent's
# stdio pipe.
[profile.profiling]
inherits = "release"
debug = true
