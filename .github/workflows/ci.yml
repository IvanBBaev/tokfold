# Continuous integration for the tokfold workspace.
#
# Required check: only the (ubuntu-latest, stable) leg is meant to gate merges.
# In branch protection, require the status check named exactly
#   "test (ubuntu-latest, stable)".
# The macOS and MSRV legs run for signal but are marked continue-on-error, so a
# red result there does not block a merge (see `continue-on-error` below).
# Windows is deliberately absent until the `mcp` subcommand is real.
#
# Every cargo invocation passes `--locked`: CI must fail when the committed
# Cargo.lock no longer matches the manifests, instead of silently resolving a
# fresh graph that nobody has reviewed or audited.
#
# Third-party action pins: every third-party action is pinned to a full commit
# SHA, with the human-readable tag in a trailing comment. A tag (`@v4`) is a
# mutable ref -- whoever controls the action repo can repoint it at new code that
# then runs with this workflow's token. The SHA is immutable, so an update is a
# reviewable diff. Bump the SHA and the comment together. Installed tools
# (cargo-deny, cargo-audit) are version-pinned for the same reason: an
# unqualified `tool: cargo-deny` installs whatever is newest at run time, so the
# policy this repo is checked against could change without a commit here.
# The Rust toolchain is installed via the runner's preinstalled rustup rather
# than a third-party action, which keeps one fewer dependency to pin and lets
# `rustup override` cleanly beat the repo's rust-toolchain.toml on the MSRV leg.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan (Mondays 06:00 UTC). A PR-only audit misses advisories that
    # are published *after* code has already shipped; this job re-checks the
    # released tree against a fresh advisory database. See the `audit` job.
    #
    # LIMITATION (GitHub platform behaviour, not something this file can undo):
    # GitHub disables `schedule` triggers automatically after 60 days without
    # repository activity, and only emails the repo owner. On a low-traffic repo
    # the weekly audit therefore stops silently. Two mitigations:
    #   1. `workflow_dispatch` below -- the audit can always be run by hand
    #      (`gh workflow run ci.yml`), which is also how you confirm it still
    #      works after a quiet period.
    #   2. If the schedule has been disabled, re-enable it with
    #      `gh workflow enable ci.yml` (or the Actions tab); pushing a commit
    #      alone does not restore a disabled schedule.
    - cron: "0 6 * * 1"
  # Manual trigger: runs the full matrix *and* the audit job. Kept as the
  # escape hatch for the 60-day schedule auto-disable described above.
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes does not queue up.
# The event name is part of the key on purpose: a scheduled run carries the default
# branch ref, so a ref-only group would put the weekly audit and pushes to main in
# the same bucket and let a push cancel the audit -- the one job whose entire value
# is running on its own schedule against a fresh advisory database.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here needs write access to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Push/PR/manual; the scheduled trigger drives the `audit` job instead.
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    # Non-required legs report for signal but must not block a merge.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      # Report every leg's result; do not abort siblings on the first failure.
      fail-fast: false
      matrix:
        include:
          # The one required check. `--all-features` also exercises the opt-in
          # `tiktoken` estimator tests, which default features leave uncompiled.
          - os: ubuntu-latest
            toolchain: stable
            required: true
            flags: "--locked"
            features: "--all-features"
          # Signal-only: catches platform-specific breakage.
          - os: macos-latest
            toolchain: stable
            required: false
            flags: "--locked"
            features: "--all-features"
          # Signal-only: MSRV guard. `--locked` proves the committed Cargo.lock
          # still resolves under the minimum supported Rust version. Default
          # features only: this leg's contract is that the DEFAULT consumer build
          # works on the MSRV, so it deliberately does not enable `tiktoken`.
          - os: ubuntu-latest
            toolchain: "1.85"
            required: false
            flags: "--locked"
            features: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust ${{ matrix.toolchain }}
        # Uses the runner's preinstalled rustup. `override set` makes cargo use
        # this toolchain in the repo dir, overriding rust-toolchain.toml (needed
        # so the MSRV leg actually runs on 1.85 rather than stable).
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rustfmt -c clippy
          rustup override set ${{ matrix.toolchain }}
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # rustfmt and clippy are toolchain-version-sensitive: their lint sets drift
      # between releases (lints get added, renamed, or deprecated). Running
      # `clippy -D warnings` on the MSRV or macOS legs turns that drift into
      # spurious failures unrelated to the MSRV contract. Pin both to the single
      # required stable leg; the other legs prove the code compiles and its tests
      # pass on their toolchain/OS, which is the guarantee they actually exist for.
      - name: Format check
        if: matrix.required
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.required
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # PROPTEST_CASES is read by `tests/roundtrip.rs::config()`, which defaults to
      # 32 so a local `cargo test` stays fast. Without this variable CI ran the
      # same 32 cases the developer machine does -- 32x fewer than the suite's own
      # module docs claim -- so the property suite was far weaker in the one place
      # it is meant to be strongest. Raising it here (not in the code default) keeps
      # the local loop quick while the gating leg actually searches.
      - name: Test
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --workspace ${{ matrix.features }} ${{ matrix.flags }}

      # rustdoc is a third compiler front end with its own lint set (broken
      # intra-doc links, invalid rustdoc attributes), none of which `cargo test`
      # or `cargo clippy` can see. `--all-features` documents the optional
      # `tiktoken` items too, so a link into them cannot rot unnoticed. Same
      # toolchain-drift argument as rustfmt/clippy: required leg only.
      #
      # `--cfg docsrs` is deliberately NOT passed here even though
      # [package.metadata.docs.rs] sets it. That cfg enables
      # `#![feature(doc_cfg)]` in tokfold-core, and a `#![feature]` attribute is a
      # hard error off nightly -- docs.rs builds on nightly, this leg is stable.
      # Mirroring the flag would fail the build for a reason unrelated to the docs.
      - name: Docs (rustdoc)
        if: matrix.required
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

      # cargo-deny and the publish dry-run are platform- and toolchain-independent,
      # so they run once on the required leg only. cargo-deny needs the advisory
      # database, which the runner fetches over the network.
      - name: Install cargo-deny
        if: matrix.required
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # Version-pinned: cargo-deny's config schema and default lint levels
          # change between releases, so an unpinned install can turn a green
          # policy red (or the reverse) with no commit in this repo.
          tool: cargo-deny@0.20.2

      - name: Supply-chain policy (cargo-deny)
        if: matrix.required
        run: cargo deny check

      # Packaging must be checked for *every* publishable crate: a manifest can
      # be unpublishable (missing README, a path dependency without a version,
      # an excluded file the build needs) in a way nothing else in CI notices.
      # `--workspace` packages all three crates and verifies each against the
      # just-packaged copies of its workspace dependencies, which is why this is
      # stable-only -- multi-package `cargo publish` needs a recent cargo, and
      # the MSRV leg's 1.85 cargo does not have it.
      - name: Packaging dry-run (all crates)
        if: matrix.required
        run: cargo publish --dry-run --workspace --locked

  audit:
    # Scheduled (and manual) companion to CI: re-audits already-shipped code.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: audit (weekly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        # Deliberately unpinned: an advisory re-scan should run on the current
        # stable toolchain, and no compiled artifact of this job is shipped.
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # Version-pinned like cargo-deny above. The *advisory database* is
          # still fetched fresh on every run -- that is the moving part this job
          # exists for; the tool binary is not.
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        # cargo-audit reads the committed Cargo.lock directly; it has no
        # `--locked` flag of its own (that is a cargo-resolver option).
        run: cargo audit
