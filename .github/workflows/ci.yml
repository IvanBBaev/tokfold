# Continuous integration for the tokfold workspace.
#
# ---------------------------------------------------------------------------
# Job layout, and why it looks like this
# ---------------------------------------------------------------------------
# Every gating check used to live inside the `test` matrix behind
# `if: matrix.required`. That made each gate depend on a *data value*: one
# renamed, mistyped or forgotten `required:` key and rustfmt, clippy, rustdoc,
# cargo-deny and the packaging check would all silently skip while the job still
# reported green. A gate that can disappear without anyone noticing is not a
# gate, so each one now has its own top-level job:
#
#   actionlint  -- lints this workflow itself, so a malformed job fails loudly
#                  instead of being skipped or ignored by the runner
#   fmt         -- cargo fmt --all --check
#   clippy      -- cargo clippy --workspace --all-targets --all-features
#                  --locked -- -D warnings
#   docs        -- cargo doc --workspace --all-features --no-deps --locked,
#                  under RUSTDOCFLAGS=-D warnings
#   doc-drift   -- the EXPERIMENTAL-notice test in tokfold-mcp (see that job)
#   deny        -- cargo deny --locked check (supply-chain policy)
#   package     -- cargo package --workspace --locked
#   launcher    -- node --test over the npm launcher (see that job)
#   fuzz        -- builds every cargo-fuzz target under fuzz/ on a pinned
#                  nightly and runs each for 60 seconds, or for 600 seconds
#                  on a scheduled or manual run (see that job)
#
# Where a line above gives a command, it is that job's `run:` verbatim (the
# `docs` line names its RUSTDOCFLAGS separately, because that one is an
# environment variable and not an argument), so a reader can paste it and get
# what the runner gets. The shortened spellings this list carried until
# 2026-09-22 were not shorter ways of saying the same thing: the one it gave for
# clippy, `cargo clippy --all-targets --all-features -D warnings`, is refused by
# cargo outright -- "unexpected argument '-D' found", because `-D warnings` is an
# argument for the lint driver and has to follow a `--`. A legend nobody can run
# cannot be checked against the job it claims to summarize, which is the only
# thing a legend is for. Four lines describe rather than quote: `doc-drift`,
# `launcher` and `fuzz` point at their own job (`fuzz` has five `run:` steps and
# a loop, which no single line can quote), and `actionlint` runs a downloaded
# binary (`./actionlint -color`) rather than a cargo command.
#
# Eight of those nine jobs carry exactly one job-level condition, `if:
# github.event_name != 'schedule'`, which keeps the weekly cron from paying for
# the whole gate a second time. The ninth, `fuzz`, carries no job-level `if:`:
# it runs on every trigger, and the trigger decides only how long it fuzzes. It
# is not free of `if:` altogether, and it is the only one of the nine that is
# not -- its crash-artifact upload step carries `if: failure()`, which skips
# that step on success and gates nothing. The job-level condition is the only
# way a gate can be skipped, and it is visible in one grep. What it
# deliberately is *not* is conditional on a matrix value: nothing a
# contributor can rename or mistype in a `required:` key can turn one of *those
# nine* gates off on a push or a pull request.
#
# The `test` matrix is now only about *running the test suite* on each
# OS/toolchain/feature combination. Its `required` key still exists, and its only
# remaining job is to decide `continue-on-error`.
#
# That is not the same as "no gate hangs off it", which this comment used to
# claim, and the difference is worth being exact about. Three `test` legs are on
# the branch-protection list below, and the `continue-on-error` expression on
# that job is precisely what decides whether a failing leg still reports success.
# Flip `required: true` to `false` on one of those three and it goes green while
# failing -- the very thing the paragraph above says a `required:` key can no
# longer do. The nine jobs are unreachable that way; those three legs are not.
# Closing the gap would mean hoisting the required legs out of the matrix, which
# renames the checks branch protection matches by exact string, so it is not a
# change to make quietly.
#
# NOTE ON `package`: it runs `cargo package`, which builds the .crate tarballs
# and verifies they compile, and it talks to no registry. It is deliberately not
# `cargo publish --dry-run` -- see the reasoning on the `package` job itself.
# Nothing in *this* workflow authenticates to, or publishes on, any package
# registry, and nothing here should ever be given a credential that would let it.
# Publication lives in `release.yml`, which is `workflow_dispatch`-only and
# publishes to npm alone; it is the only workflow holding a registry token, and
# no push, tag, merge or schedule can start it.
#
# TO BE APPLIED in branch protection -- this is a to-do, not a description of the
# current setup: `main` is NOT protected today (no ruleset, no required checks),
# so nothing below is enforced yet and any of these can be red at merge time.
# When protection is configured, require these status checks (exact names):
#   actionlint
#   fmt
#   clippy
#   docs
#   doc-drift
#   deny
#   package
#   launcher (linux-node18)
#   launcher (linux-node22)
#   launcher (macos-node22)
#   launcher (windows-node22)
#   test (ubuntu-stable-all-features)
#   test (ubuntu-1.85-default-features)
#   test (ubuntu-1.85-all-features)
# The names are the leg ids, not prose: GitHub matches a required check by exact
# string, and a required name no job ever reports stays pending forever, so a
# guessed name blocks every pull request on a check that cannot go green.
# The macOS and Windows legs of the `test` matrix run for signal only and are
# `continue-on-error`, which is why they are not on the list. The `launcher` job
# has no `continue-on-error` on any leg -- all four block today, and all four
# belong on the list: they are the only gate covering the shipped JavaScript,
# which no cargo command reads. The `fuzz` job has no `continue-on-error`
# either, so it fails the run today, but it is deliberately not on the list:
# whether a 60-second fuzz smoke test may block a merge is the owner's call, not
# this file's, and a required check is added in the repository settings.
#
# ---------------------------------------------------------------------------
# Conventions that apply to every job below
# ---------------------------------------------------------------------------
# Every cargo invocation that resolves a dependency graph passes `--locked`: CI
# must fail when the committed Cargo.lock no longer matches the manifests,
# instead of silently resolving a fresh graph that nobody has reviewed or
# audited. Five invocations below carry no `--locked`, and not one of the five is
# an exception to that rule. Check it with
#
#   grep -n 'cargo ' .github/workflows/ci.yml | grep -v '#' | grep -v 'Cache cargo'
#
# which lists 16 invocations today, and again with `| grep -v -- --locked`, which
# leaves those five. One of them is outside the rule: `cargo fmt --all --check`
# never touches the graph, so it has no graph to lock. The other four cannot take
# the flag. `cargo audit` rejects it outright (it reads the committed Cargo.lock
# directly), as its own job comment explains. `cargo fuzz` (0.13.2) has no such
# option on `build`, `run` or `list`, and the `fuzz` job runs all three -- so it
# checks its own lockfile, `fuzz/Cargo.lock`, with a separate `cargo fetch
# --locked` before any of them. Note that `cargo deny` *does* accept the flag and
# carries it: it resolves the graph via `cargo metadata`.
#
# Third-party action pins: every third-party action is pinned to a full commit
# SHA, with the human-readable tag in a trailing comment. A tag (`@v4`) is a
# mutable ref -- whoever controls the action repo can repoint it at new code that
# then runs with this workflow's token. The SHA is immutable, so an update is a
# reviewable diff. Bump the SHA and the comment together. The installed tools are
# version-pinned for the same reason: an unqualified install pulls whatever is
# newest at run time, so the policy this repo is checked against could change
# without a commit here. There are four of them, and they arrive three different
# ways: cargo-deny and cargo-audit through `taiki-e/install-action`, actionlint as
# a download whose tarball is checked against a recorded SHA-256, and cargo-fuzz
# through `cargo install cargo-fuzz --version 0.13.2 --locked` in the `fuzz` job.
# That last one is the one to remember when auditing this paragraph: it is the
# only tool installed by a cargo command rather than by an action or a curl, so a
# reader looking only at `uses:` lines will not see it.
# The Rust toolchain is installed via the runner's preinstalled rustup rather
# than a third-party action, which keeps one fewer dependency to pin and lets
# `rustup override` cleanly beat the repo's rust-toolchain.toml on the MSRV legs.
#
# `persist-credentials: false` on every checkout: the default leaves the job's
# GITHUB_TOKEN written into .git/config for the rest of the run, where any build
# script, proc macro or test in this workspace's dependency tree could read it.
# Nothing here pushes, so nothing here needs the credential to survive checkout.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly slot (Mondays 06:00 UTC). Three jobs hang off it -- `audit`,
    # `release-test` and `nightly` -- because all three answer questions that a
    # per-PR run cannot: a PR-only audit misses advisories published *after* code
    # shipped, and the release profile and the nightly toolchain are moving
    # targets that no PR changes. The `fuzz` gate runs here too, and it is the
    # only gate that does: on this slot it fuzzes each target for 600 seconds
    # instead of the 60 a push or a pull request gets.
    #
    # LIMITATION (GitHub platform behaviour, not something this file can undo):
    # GitHub disables `schedule` triggers automatically after 60 days without
    # repository activity, and only emails the repo owner. On a low-traffic repo
    # the weekly jobs therefore stop silently. Two mitigations:
    #   1. `workflow_dispatch` below -- the weekly jobs can always be run by hand
    #      (`gh workflow run ci.yml`), which is also how you confirm they still
    #      work after a quiet period.
    #   2. If the schedule has been disabled, re-enable it with
    #      `gh workflow enable ci.yml` (or the Actions tab); pushing a commit
    #      alone does not restore a disabled schedule.
    - cron: "0 6 * * 1"
  # Manual trigger: runs the full matrix, every gate, *and* the weekly jobs, with
  # `fuzz` at its weekly length of 600 seconds a target.
  # Kept as the escape hatch for the 60-day schedule auto-disable described above.
  workflow_dispatch:

# Cancel superseded runs, but only for pull requests. A PR gets a new run on
# every push and only the newest one is interesting, so cancelling is free. A
# push to a branch is not the same: cancelling mid-run destroys the only CI
# result that commit will ever have, and on a long-lived branch a burst of
# pushes would leave a trail of commits whose status is "cancelled" rather than
# pass or fail. Scheduled and manual runs are never cancelled either -- the
# weekly jobs exist precisely to run on their own schedule against a fresh
# advisory database and a fresh nightly.
# The event name stays in the group key so a scheduled run (which carries the
# default branch ref) can never share a bucket with a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here needs write access to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gates. Each of these is a separate job on purpose -- see the header. The one
  # condition they carry is `github.event_name != 'schedule'`, which depends on
  # the trigger alone; `fuzz` carries none and runs on every trigger. None of
  # them may grow an `if:` that depends on matrix data.
  # ---------------------------------------------------------------------------

  actionlint:
    # Lints this workflow file (and any sibling under .github/workflows). Without
    # it a typo in a job key does not fail: GitHub either ignores the unknown key
    # or skips the job, and the run still goes green. Since the gates above are
    # now *jobs*, a workflow-level typo is exactly the failure mode that would
    # bring back the silent-skip problem this restructure removed.
    if: github.event_name != 'schedule'
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        # Installed from the pinned release tarball and checksum-verified rather
        # than through a third-party action or the upstream `curl | bash`
        # installer: this is one binary, and a version plus a SHA-256 is a
        # stronger pin than either. To bump: change the version in both places
        # and take the new hash from
        # https://github.com/rhysd/actionlint/releases/download/vX.Y.Z/actionlint_X.Y.Z_checksums.txt
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Lint workflows
        # shellcheck and pyflakes are preinstalled on ubuntu-latest, so actionlint
        # also checks the bodies of every `run:` block here.
        run: ./actionlint -color

  fmt:
    if: github.event_name != 'schedule'
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        # rustfmt and clippy are toolchain-version-sensitive: their rule sets
        # drift between releases (rules get added, renamed, or deprecated).
        # Running them on the MSRV toolchain turns that drift into spurious
        # failures unrelated to the MSRV contract, so both gates are stable-only.
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal -c rustfmt
          rustup override set stable
          rustc --version

      - name: Format check
        run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal -c clippy
          rustup override set stable
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        # `--all-targets` so tests and benches are linted too: the workspace sets
        # clippy pedantic+nursery to warn, and `-D warnings` makes every one of
        # those a hard error wherever it appears. `--workspace` is explicit for
        # the same reason every sibling gate spells it out: the root manifest is
        # virtual today, so bare cargo already selects all three members, but a
        # `default-members` added for faster local builds would silently narrow
        # this gate to one crate while `-D warnings` stayed green.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    if: github.event_name != 'schedule'
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # rustdoc is a third compiler front end with its own lint set (broken
      # intra-doc links, invalid rustdoc attributes), none of which `cargo test`
      # or `cargo clippy` can see. `--all-features` documents the optional
      # `tiktoken` items too, so a link into them cannot rot unnoticed.
      #
      # `--cfg docsrs` is deliberately NOT passed here even though
      # [package.metadata.docs.rs] sets it. That cfg enables
      # `#![feature(doc_cfg)]` in tokfold-core, and a `#![feature]` attribute is a
      # hard error off nightly -- docs.rs builds on nightly, this job is stable.
      # Mirroring the flag would fail the build for a reason unrelated to the docs.
      - name: Docs (rustdoc)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

  doc-drift:
    # rustdoc above only checks that the docs *compile* and that their links
    # resolve; it cannot notice that a shipped README or crate-level doc comment
    # promises behaviour the code no longer has.
    #
    # BE PRECISE ABOUT WHAT THIS GATE COVERS, because the job name oversells it.
    # `tokfold-mcp/tests/experimental_notice.rs` pins exactly one claim: that the
    # EXPERIMENTAL warning still says what it must, and that the crate
    # description agrees with it. That test opens no README and reads no markdown,
    # so this gate catches drift in the one claim it was written for and in
    # nothing else.
    #
    # It is not the only machine-checked documentation in the repo, though this
    # comment said it was -- "there is no `include_str!` anywhere in this
    # workspace" -- until `df6a0fc` added one. `tokfold-mcp/tests/quickstart.rs`
    # pulls `crates/tokfold-mcp/README.md` in with `include_str!` and reads the
    # three blocks marked `quickstart-session`, `quickstart-replies` and
    # `quickstart-rendering`, replaying that session through `stdio::serve` in
    # process, so losing a marker or editing a quoted reply turns a check red.
    # That check is not this one: `quickstart` only rides along inside `cargo test
    # --workspace`, so it reports under `test`. Its own header states what it
    # leaves open -- an elided run is unconstrained, and the `tokfold mcp <<'EOF'`
    # line is compared as text and never run. Every README line and doc comment
    # outside those three blocks is still guarded by review alone.
    #
    # The name is kept because branch protection requires it by exact string.
    # Widening the gate means adding assertions to that test (or a new one) and
    # extending this comment -- not renaming the job.
    #
    # It is its own job (rather than only riding along inside `cargo test
    # --workspace`) so that "the notice drifted" is a distinct, nameable red check
    # that branch protection can require and that nobody has to dig a log to find.
    if: github.event_name != 'schedule'
    name: doc-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Docs vs. code (experimental notice)
        run: cargo test -p tokfold-mcp --test experimental_notice --all-features --locked

  deny:
    if: github.event_name != 'schedule'
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # Version-pinned: cargo-deny's config schema and default lint levels
          # change between releases, so an unpinned install can turn a green
          # policy red (or the reverse) with no commit in this repo.
          tool: cargo-deny@0.20.2

      - name: Supply-chain policy (cargo-deny)
        # Needs the advisory database, which the runner fetches over the network.
        # `--locked` is a top-level cargo-deny option and must precede `check`:
        # cargo-deny shells out to `cargo metadata`, which rewrites Cargo.lock if
        # the manifests have drifted, so without the flag the one job whose whole
        # purpose is auditing the dependency graph could audit a freshly resolved
        # graph nobody committed.
        run: cargo deny --locked check

  package:
    if: github.event_name != 'schedule'
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Packaging must be checked for *every* publishable crate: a manifest can
      # be unpublishable (missing README, a path dependency without a version,
      # an excluded file the build needs) in a way nothing else in CI notices.
      # `--workspace` packages all three crates and verifies each against the
      # just-packaged copies of its workspace dependencies, which is why this is
      # stable-only: 1.85's cargo resolves each crate against the registry alone,
      # so it fails on tokfold-mcp with "no matching package named tokfold-core"
      # -- a real limitation of that cargo, not of these manifests.
      #
      # `cargo package`, not `cargo publish --dry-run`. The two run the same
      # checks -- build the tarballs, then compile each one against the packaged
      # copies of its workspace dependencies -- but `cargo package` has no upload
      # path at all, while `publish --dry-run` is a real release command one
      # dropped flag away from being a release. crates.io publication is
      # deliberately held for this project, so the gate that runs on every pull
      # request and every push to `main` is the one that cannot publish even if
      # it is edited wrongly. (The npm
      # packages *are* published, but from `release.yml` on manual dispatch and
      # never from here; this job still has no way to upload anything anywhere.)
      - name: Packaging check (all crates)
        run: cargo package --workspace --locked

  launcher:
    # The npm launcher (`npm/tokfold/bin/tokfold` and `lib/resolve.js`) is
    # shipped code that no other job here compiles, runs or even parses: every
    # other gate above is a cargo command, actionlint reads only the workflow
    # files, and none of them reads JavaScript. It is
    # also the first thing a user meets -- `npm i -g tokfold` installs the
    # launcher, and the Rust binary is only ever reached through it -- so a
    # broken platform mapping or a swallowed exit code is a total outage for
    # that install path while the whole Rust gate stays green.
    #
    # `release.yml` checks the launcher twice. Statically, in `verify`: that
    # both files parse, that the platform table, the manifests under
    # `npm/platforms/` and the launcher's `optionalDependencies` name the same
    # five packages, and that each of those packages declares the `os` and `cpu`
    # its table key promises. And dynamically, in `publish`: its "End-to-end
    # test through the launcher" step builds a `node_modules` layout and runs
    # the command through it six times, asserting `--version`, a `cmp`-verified
    # compress/expand round trip, and exit `3` and exit `2` crossing the
    # wrapper. So "without running anything" is false, and of the behaviours
    # this comment used to list as unchecked there, exit-code propagation and
    # argument passing are checked.
    #
    # What is actually left to this job. `release.yml` is
    # `workflow_dispatch`-only, so none of it can catch a regression before
    # merge; its dynamic step runs on one platform package
    # (`linux-x64-gnu`) and never on Windows or macOS; and signal re-raise and
    # the musl refusal are asserted nowhere but here. That is the gap worth
    # naming, on every pull request and every push to `main`.
    #
    # No dependency install step, and no lockfile to cache: the suite imports
    # nothing from outside Node's standard library. Six builtins, measured with
    # `grep -hoE "(require|from)[^)]*" npm/tests/*.js`: `node:assert/strict`,
    # `node:child_process`, `node:fs`, `node:os`, `node:path`, `node:test`, plus
    # the local `./fixtures.js`. Naming two of the six -- as this comment did --
    # is an enumeration that goes stale the first time a test needs `node:fs`;
    # the property worth asserting is "no third-party package", not a list. The
    # npm packages in this repo ship with zero dependencies on purpose, and a
    # `node_modules` under `npm/` would be a regression in the thing being
    # tested.
    if: github.event_name != 'schedule'
    name: launcher (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg; a failure on one Node version or one OS is not a
      # reason to hide the others' results.
      fail-fast: false
      matrix:
        include:
          # Both Node legs are required. `npm/tokfold/package.json` declares
          # `engines: { node: ">=18" }`, and that floor is a promise made to
          # every user whose distro still ships Node 18. A single leg on the
          # runner's default Node would let an optional-chaining assignment, a
          # `structuredClone` or any other newer builtin land in the launcher
          # and break exactly the users the floor was written for -- with CI
          # green. 18 is the floor the package claims; 22 is the version
          # `release.yml` publishes from.
          - leg: linux-node18
            os: ubuntu-latest
            node: "18"
          - leg: linux-node22
            os: ubuntu-latest
            node: "22"
          # Windows is not a duplicate of the Linux legs. `lib/resolve.js` has a
          # branch that only ever runs there -- the binary is `tokfold.exe`, and
          # the win32 entries in the platform table are the ones a Linux or
          # macOS host can only reach through a stubbed `process.platform`. We
          # publish a `tokfold-windows-x64` package, so the one host that resolves
          # it for real should be a host CI has actually used.
          #
          # It is also the only place `packaging.test.js` takes its `shell: true`
          # path: `npm` on PATH is `npm.cmd` there, and since the fix for
          # CVE-2024-27980 Node refuses to spawn a `.cmd` without a shell. On
          # Linux that branch is dead code.
          #
          # One Node version rather than two, and 22 because that is what
          # `release.yml` publishes from. The engines floor is a promise about
          # the JavaScript the launcher uses, and that is the same JavaScript on
          # every OS -- the Linux legs already hold that line. What is being
          # bought here is the platform branch, not a second version sweep.
          #
          # `launcher.test.js` skips *part* of itself on Windows and says so:
          # its stand-in binary is a `#!/bin/sh` script that Windows cannot
          # exec, so every test needing a child that runs is skipped, and so is
          # the cleared-execute-bit case -- for the unrelated reason that
          # Windows does not deny execution through mode bits. The launcher
          # failure paths that never start a child do run here. That is a real
          # gap, not a silent one: on Windows this leg covers the resolver, the
          # packaging check and those failure paths, and the process-level
          # exit-code and signal contract is carried by the legs below and
          # above.
          - leg: windows-node22
            os: windows-latest
            node: "22"
          # macOS runs the process-level suite for real, and it is the only host
          # here that is not Linux and not Windows. Signals, orphan reaping and
          # `stdio: "inherit"` are kernel behaviour, and two of the five
          # published binaries are macOS binaries: the launcher's contract
          # should hold on a BSD kernel because it was observed to, not because
          # Linux implies it.
          - leg: macos-node22
            os: macos-latest
            node: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # No `registry-url`, deliberately, unlike the publish job in
          # release.yml: this job never talks to a registry, so it has no reason
          # to be handed an .npmrc that knows where one is.

      # Run from inside the directory with no path argument. Naming the
      # directory depends on the Node version: `node --test npm/tests` ran all
      # 76 tests on v18.20.8 and v20.20.2, and on v22.23.0 and v22.23.2 handed
      # the directory to the module loader instead, dying with "Cannot find
      # module" before a test ran (measured on macOS; the release where it
      # changed was not bisected). So the node22 legs could not use it. The
      # no-argument form ran all 76 on v18.20.8 and v22.23.2, the two majors
      # this job covers (measured on macOS), and so does the one path-taking
      # form that works on both, a glob: `node --test npm/tests/*.test.js`.
      #
      # Auto-discovery is also the point: a new test file is picked up by
      # virtue of existing, with no list here to forget to extend. Naming the files
      # individually would reintroduce the silent-skip failure mode this
      # workflow's header describes, one directory over.
      - name: Launcher test suite (node --test)
        working-directory: npm/tests
        run: node --test

  fuzz:
    # Builds every cargo-fuzz target under `fuzz/` and runs each one for
    # `FUZZ_SECONDS`: 60 seconds on every pull request and every push to `main`,
    # 600 seconds on the weekly schedule and on a manual run. The targets and
    # what each one asserts are described in `fuzz/README.md`. The 60-second run
    # only has to find a regression that a minute of mutation from the committed
    # seeds can reach; the 600-second run goes further from the same seeds,
    # without holding up a pull request. Neither is a claim of coverage: every
    # run starts from the committed seeds, because nothing here keeps the corpus
    # a previous run grew. A real campaign is a local, longer run (the README
    # says how).
    #
    # This is the only gate without `if: github.event_name != 'schedule'`. It
    # runs on every trigger, and the trigger picks only `FUZZ_SECONDS` and
    # `timeout-minutes`.
    #
    # Nightly is required -- cargo-fuzz builds with `-Zsanitizer=address` -- and
    # it is pinned to a dated build rather than the moving `nightly` channel, so
    # a red mark here is a finding in this repo and not upstream churn. The
    # weekly `nightly` job below is the one that tracks the moving channel. To
    # bump: change the date here and in `fuzz/README.md`, and rebuild `fuzz/`
    # locally first.
    #
    # `fuzz/` is its own workspace with its own `Cargo.lock` and is not a member
    # of the root one, so nothing else in this file compiles it. "Nothing here
    # depends on nightly except this job" would be false -- the `nightly` job
    # below installs a nightly toolchain too. What holds is the narrower claim:
    # no *required* check depends on nightly, since both jobs that use it are
    # `continue-on-error` and neither runs on a pull request. cargo-fuzz 0.13.2 has no `--locked`
    # option on `build`, `run` or `list`, so the lockfile is checked by the
    # `cargo fetch --locked` step before any of them runs: a stale
    # `fuzz/Cargo.lock` fails there instead of being re-resolved silently.
    #
    # `timeout-minutes` is the only one in this file, because this is the only
    # job whose work is open-ended by construction: `-max_total_time` bounds the
    # mutation loop and `-timeout` bounds each single input, and the job limit is
    # the backstop for a hang in neither (the build included). It is 30 minutes
    # for the 60-second run, whose five targets fuzz for 5 minutes in total, and
    # 80 minutes for the 600-second run, whose five targets fuzz for 50. The
    # rest of each budget is for the toolchain, cargo-fuzz and the build. Neither
    # limit is derived from the number of targets: a sixth target adds 1 or 10
    # minutes of fuzzing to a budget that stays where it is.
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 80 || 30 }}
    env:
      FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 600 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust nightly (pinned)
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-09-28 --profile minimal
          rustup override set nightly-2026-09-28
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        # Built from source at a pinned version with its own lockfile, like the
        # other installed tools in this file are version-pinned.
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Check fuzz/Cargo.lock
        working-directory: fuzz
        run: cargo fetch --locked

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo fuzz build

      - name: Run each fuzz target for FUZZ_SECONDS
        # The target list comes from `cargo fuzz list`, which reads the `[[bin]]`
        # tables in `fuzz/Cargo.toml`, so a new target is run by virtue of being
        # declared -- there is no list here to forget to extend. Each run starts
        # from the committed seeds in `fuzz/seeds/<target>` (read-only: libFuzzer
        # writes new inputs only into the first corpus directory).
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="$(cargo fuzz list)"
          test -n "$targets"
          for target in $targets; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -dict=json.dict
          done

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Test matrix. Runs the suite on each OS/toolchain/feature combination. Three of
  # its five legs gate: `continue-on-error` below is `!matrix.required`, so a
  # failing required leg fails the run, and those same three legs are on the
  # branch-protection list in this file's header. The other two report for signal
  # only. The header spells out why "no gate hangs off it" is true of the nine
  # jobs above and false of these three legs.
  # ---------------------------------------------------------------------------

  test:
    # Push/PR/manual; the scheduled trigger drives the weekly jobs instead.
    if: github.event_name != 'schedule'
    name: test (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    # Non-required legs report for signal but must not block a merge. This is the
    # *only* thing `matrix.required` controls now.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      # Report every leg's result; do not abort siblings on the first failure.
      fail-fast: false
      matrix:
        include:
          # `--all-features` also exercises the opt-in `tiktoken` estimator
          # tests, which default features leave uncompiled.
          - leg: ubuntu-stable-all-features
            os: ubuntu-latest
            toolchain: stable
            required: true
            features: "--all-features"
          # Signal-only: catches platform-specific breakage.
          - leg: macos-stable-all-features
            os: macos-latest
            toolchain: stable
            required: false
            features: "--all-features"
          # Signal-only: the `mcp` stdio transport strips CRLF and writes bare LF,
          # and Windows is the only platform where getting that wrong shows up.
          - leg: windows-stable-all-features
            os: windows-latest
            toolchain: stable
            required: false
            features: "--all-features"
          # MSRV guard, default features: this leg's contract is that the DEFAULT
          # consumer build works on the minimum supported Rust version, so it
          # deliberately does not enable `tiktoken`. `--locked` also proves the
          # committed Cargo.lock still resolves under 1.85.
          #
          # REQUIRED, and it did not use to be. Two reasons it has to block:
          # (1) the 1.85 floor is a live constraint, not a theoretical one --
          #     `tokfold-mcp/src/stdio.rs` documents a construct written the long
          #     way purely because let-chains need 1.88. Code that quietly needs a
          #     newer rustc is written all the time; a non-blocking leg means it
          #     is merged and only discovered by a user on 1.85.
          # (2) this is the only place the DEFAULT feature set is tested at all.
          #     Everything else here runs `--all-features`, so before this leg
          #     blocked, a break confined to the default build could reach main
          #     with every required check green.
          - leg: ubuntu-1.85-default-features
            os: ubuntu-latest
            toolchain: "1.85"
            required: true
            features: ""
          # MSRV guard, all features. The `tiktoken` feature pulls in
          # tiktoken-rs and its regex/fancy-regex tree, none of which had ever
          # been compiled on 1.85: every `--all-features` leg ran on stable and
          # the only MSRV leg ran on default features, so the opt-in estimator's
          # MSRV claim was never tested by anything.
          - leg: ubuntu-1.85-all-features
            os: ubuntu-latest
            toolchain: "1.85"
            required: true
            features: "--all-features"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.toolchain }}
        # Uses the runner's preinstalled rustup. `override set` makes cargo use
        # this toolchain in the repo dir, overriding rust-toolchain.toml (needed
        # so the MSRV legs actually run on 1.85 rather than stable).
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup override set ${{ matrix.toolchain }}
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # PROPTEST_CASES is read by proptest itself, so it raises every property
      # block in the workspace: the ones in `tokfold-core/tests/roundtrip.rs` and
      # `tokfold-core/tests/hostile.rs`, whose `config()` defaults to 32 so a local
      # `cargo test` stays fast, and the ones in `tokfold-mcp/tests/properties.rs`
      # and the test module of `tokfold-core/src/encoder/e2_tabular.rs`, which take
      # proptest's own default of 256.
      # Without this variable CI ran the same handful of cases a developer machine
      # does -- far fewer than the roundtrip suite's own module docs claim -- so the
      # property tests were weakest in the one place they are meant to be strongest.
      # Raising it here rather than in the code keeps the local loop quick while CI
      # actually searches.
      - name: Test
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --workspace ${{ matrix.features }} --locked

      # A proptest failure writes the failing seed to a `.proptest-regressions`
      # file next to the test, and that file is the whole value of the run: with
      # it the failure replays deterministically on any machine, without it a
      # 1024-case CI search that found a one-in-a-thousand input is gone the
      # moment the runner is torn down. The log only shows the shrunk value, not
      # the seed. Uploading on failure keeps the reproducer.
      - name: Upload proptest regression seeds
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # One artifact per leg: v4 artifact names must be unique within a run.
          name: proptest-regressions-${{ matrix.leg }}
          path: "**/*.proptest-regressions"
          # Checked-in seed files mean this normally matches something; `ignore`
          # keeps a genuine no-match from adding a second, misleading annotation
          # on top of the test failure that is the actual news.
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Weekly jobs (schedule + manual). These answer questions no PR run can.
  # ---------------------------------------------------------------------------

  audit:
    # Scheduled (and manual) companion to CI: re-audits already-shipped code.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: audit (weekly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        # Deliberately unpinned: an advisory re-scan should run on the current
        # stable toolchain, and no compiled artifact of this job is shipped.
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          # Version-pinned like cargo-deny above. The *advisory database* is
          # still fetched fresh on every run -- that is the moving part this job
          # exists for; the tool binary is not.
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        # cargo-audit reads the committed Cargo.lock directly; it has no
        # `--locked` flag of its own (that is a cargo-resolver option).
        run: cargo audit

  release-test:
    # The whole suite under the release profile. Every other test run in this
    # file is a debug build, and debug and release are not the same program:
    # debug builds panic on integer overflow while release wraps silently
    # (`debug-assertions`/`overflow-checks` default on in dev, off in release),
    # `debug_assert!` disappears, and optimisation can change how far a
    # size/offset computation is reordered or folded. A compression engine is
    # exactly the kind of code where a length arithmetic bug shows up as a panic
    # in dev and as a wrong byte in release. Weekly rather than per-PR because a
    # full optimised rebuild is slow and this class of bug is rare, not urgent.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: release-test (weekly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (release profile)
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --workspace --release --all-features --locked

      - name: Upload proptest regression seeds
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proptest-regressions-release
          path: "**/*.proptest-regressions"
          if-no-files-found: ignore
          retention-days: 30

  nightly:
    # Weekly early-warning run on the nightly toolchain.
    #
    # Fuzzing does not live here. It has its own `fuzz` job above, on a nightly
    # pinned to a date, because a fuzz regression is a defect in this repo and
    # should surface on the change that introduced it, not on the next Monday
    # under a toolchain that moved in the meantime. That job also runs on this
    # weekly slot, for longer, on the same pinned nightly.
    #
    # What this job checks is future breakage: nightly is
    # the stable of a few months' time, so a compile error or a new lint here is
    # advance notice. Both steps are `continue-on-error` and this job is not a
    # required check -- nightly adds, renames and un-deprecates lints on its own
    # schedule, and a red mark caused by upstream churn on a Monday morning is
    # noise, not a defect in this repo.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: nightly (weekly, signal-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal -c clippy
          rustup override set nightly
          rustc --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test on nightly (release profile)
        continue-on-error: true
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --workspace --release --all-features --locked

      - name: Clippy on nightly
        continue-on-error: true
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
