# npm release for the tokfold CLI.
#
# ---------------------------------------------------------------------------
# What this publishes, and what it deliberately does not
# ---------------------------------------------------------------------------
# Six npm packages: `tokfold` (a JS launcher, no binary of its own) and five
# `tokfold-<platform>` packages each carrying one prebuilt executable. See
# `npm/README.md` for why the split exists.
#
# It publishes NOTHING to crates.io. That hold is separate and still in force;
# there is no `cargo publish` in this file and `ci.yml`'s packaging gate remains
# `cargo package`, which has no upload path at all.
#
# ---------------------------------------------------------------------------
# Why this cannot fire by accident
# ---------------------------------------------------------------------------
# `ci.yml` says a release command must never be one dropped flag away from a
# release. The same standard applies here, so publication needs FOUR independent
# things to line up, and no push, tag, merge or schedule can supply any of them:
#
#   1. `workflow_dispatch` -- a human starts it, explicitly. There is no `push:`
#      or `release:` trigger, and adding one would defeat everything below.
#   2. `dry_run` defaults to **true**. Running the workflow with the form's
#      defaults uploads nothing; it builds all five binaries and runs
#      `npm publish --dry-run`, which prints each tarball's contents.
#   3. `confirm` must be typed as the exact string `PUBLISH`. A boolean alone is
#      one mis-click; a boolean plus a typed word is not.
#   4. The version in the form must equal the version in `Cargo.toml` and in all
#      six package manifests. A release of "whatever happens to be on main" is
#      not possible.
#
# npm makes the consequence of getting this wrong permanent: a published version
# number can never be reused, and unpublish is restricted to a 72-hour window.
# That asymmetry is why the safety here is heavier than the job is long.
#
# ---------------------------------------------------------------------------
# Conventions, matching ci.yml
# ---------------------------------------------------------------------------
# Every third-party and first-party action is pinned to a full commit SHA with
# the human-readable tag in a trailing comment -- a tag is a mutable ref, a SHA
# is not. Every cargo invocation that resolves a dependency graph passes
# `--locked`. `persist-credentials: false` on every checkout, because nothing
# here pushes to git.
#
# Workflow inputs are passed into `run:` blocks through `env:` rather than
# interpolated into the script text. A `${{ }}` expansion inside a shell body is
# substituted before the shell ever sees it, so a crafted input becomes script;
# through `env:` it is only ever data.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must match Cargo.toml and all six package.json files exactly (e.g. 0.0.1)."
        required: true
        type: string
      dry_run:
        description: "Build and pack everything, but upload nothing. Leave checked unless you mean to publish."
        required: true
        type: boolean
        default: true
      confirm:
        description: "Type PUBLISH (all caps) to allow a real upload. Ignored when dry_run is checked."
        required: false
        type: string
        default: ""

# Least privilege, and the floor every job inherits unless it says otherwise.
# `id-token: write` is deliberately NOT here. Granted at workflow level it also
# reaches the five `build` legs, and `cargo build` runs `build.rs` from every
# crate in the dependency graph -- third-party code, on a runner that could then
# mint a short-lived OIDC token asserting this repository's identity. Exactly
# one job needs that ability, so exactly one job is granted it, below.
permissions:
  contents: read

# One release at a time. Two concurrent runs would race on the same version
# numbers, and the loser would fail halfway through six packages -- leaving some
# published and some not, which on npm cannot be undone by retrying.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Runs first and blocks everything else.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Confirm intent
        # Checked before anything is built, so a run that could never publish
        # fails in seconds rather than after five cross-compilations.
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PUBLISH" ]; then
            echo "::error::A real publish requires the confirm input to be exactly PUBLISH."
            exit 1
          fi
          echo "Confirmed: this run will publish."

      - name: Versions agree
        # Seven places carry the version: the Rust workspace, the launcher
        # package, its five optionalDependencies pins, and the five platform
        # packages. They are checked against each other AND against the version
        # typed into the form, so a half-finished bump cannot ship.
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The ${...} below are JavaScript template literals inside a
          # single-quoted script. Shell expansion is exactly what must NOT happen
          # to them, so SC2016 is the intended state rather than a defect.
          # shellcheck disable=SC2016
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const want = process.env.WANT;
            const problems = [];
            const check = (where, got) => {
              if (got !== want) problems.push(`${where}: ${got} (expected ${want})`);
            };

            const toml = fs.readFileSync("Cargo.toml", "utf8");
            const m = toml.match(/^\[workspace\.package\]$[\s\S]*?^version\s*=\s*"([^"]+)"/m);
            if (!m) { problems.push("Cargo.toml: no [workspace.package] version found"); }
            else { check("Cargo.toml [workspace.package].version", m[1]); }

            const main = JSON.parse(fs.readFileSync("npm/tokfold/package.json", "utf8"));
            check("npm/tokfold/package.json .version", main.version);

            const dirs = fs.readdirSync("npm/platforms").sort();
            if (dirs.length !== 5) problems.push(`npm/platforms holds ${dirs.length} directories, expected 5`);

            const pins = main.optionalDependencies ?? {};
            if (Object.keys(pins).length !== dirs.length) {
              problems.push(`optionalDependencies lists ${Object.keys(pins).length} packages but npm/platforms holds ${dirs.length}`);
            }

            for (const dir of dirs) {
              const p = JSON.parse(fs.readFileSync(`npm/platforms/${dir}/package.json`, "utf8"));
              check(`npm/platforms/${dir} .version`, p.version);
              if (!(p.name in pins)) {
                problems.push(`${p.name} is not listed in the launcher optionalDependencies`);
              } else {
                check(`optionalDependencies["${p.name}"]`, pins[p.name]);
              }
            }

            if (problems.length) {
              for (const line of problems) console.log(`::error::version mismatch -- ${line}`);
              process.exit(1);
            }
            console.log(`All seven version sites agree on ${want}.`);
          '

      - name: Launcher parses and maps every platform
        # The launcher is the one piece of shipped code no Rust test can reach.
        # This does not run tokfold; it checks that both files parse, and that
        # three lists which must name the same five packages actually do: the
        # platform table in resolve.js, the directories under npm/platforms, and
        # the launcher's own optionalDependencies.
        #
        # Any two of the three agreeing is not enough. "Versions agree" above
        # compares the dependencies against the directories, and this step used
        # to compare only the table against the directories, so a rename applied
        # to a platform manifest and to the dependency pin but not to resolve.js
        # satisfied every gate in this file and shipped a launcher that resolves
        # a package it does not depend on. Either way the drift surfaces as "no
        # prebuilt binary for linux-arm64", months later, on someone else's
        # machine.
        #
        # `node --check` here runs on the runner's default Node, not on the
        # `>=18` floor `npm/tokfold/package.json` declares, so it is a parse
        # check and nothing more: a newer builtin would sail through it. The
        # floor is tested for real by the `launcher` job in ci.yml, which runs
        # the suite on 18 and 22 on every push, and which also covers the
        # behaviour this step cannot see -- exit codes, signals, the musl
        # refusal, the missing-package path.
        run: |
          set -euo pipefail
          node --check npm/tokfold/bin/tokfold
          node --check npm/tokfold/lib/resolve.js
          # As above: JavaScript template literals, not shell expansions.
          # shellcheck disable=SC2016
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const { PACKAGES } = require("./npm/tokfold/lib/resolve.js");
            const main = JSON.parse(fs.readFileSync("npm/tokfold/package.json", "utf8"));
            const fromTable = Object.values(PACKAGES).sort();
            const fromDisk = fs.readdirSync("npm/platforms").sort().map((d) => `tokfold-${d}`);
            const fromDeps = Object.keys(main.optionalDependencies ?? {}).sort();
            if (JSON.stringify(fromTable) !== JSON.stringify(fromDisk)) {
              console.log(`::error::resolve.js maps to [${fromTable}] but npm/platforms holds [${fromDisk}]`);
              process.exit(1);
            }
            if (JSON.stringify(fromTable) !== JSON.stringify(fromDeps)) {
              console.log(`::error::resolve.js maps to [${fromTable}] but the launcher depends on [${fromDeps}]`);
              process.exit(1);
            }
            console.log(`resolve.js, npm/platforms and optionalDependencies agree on ${fromDisk.length} targets.`);
          '

      - name: No symlinks under npm/
        # A regression guard for a defect that already happened once and was
        # invisible: the licence files were symlinks into the repository root,
        # `npm pack` dropped them without a word, and the tarball would have been
        # published under a dual licence carrying neither licence text.
        #
        # Nothing under `npm/` may be a symlink. The licences are copied in at
        # publish time instead; see the "Stage the licences" step.
        run: |
          set -euo pipefail
          found="$(find npm -type l)"
          if [ -n "$found" ]; then
            echo "::error::npm/ contains symlinks, which npm pack silently drops:"
            echo "$found"
            exit 1
          fi
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          echo "No symlinks under npm/, and both licence texts are present at the root."

      - name: No lifecycle scripts under npm/
        # npm runs a package's lifecycle scripts on publish -- in the publish
        # job, with the release token in the environment -- and again on every
        # user's machine at install time. None of the six manifests declares
        # any, and `npm publish --ignore-scripts` in the publish job means one
        # appearing would not run *here*; this step is the other half, so one
        # appearing does not get published either.
        #
        # It exists because nothing else in this file would notice. Every other
        # check reads versions, names, files and directory sets, so a single
        # added line in one manifest would ship code that runs on install with
        # all gates green.
        run: |
          set -euo pipefail
          # As above: JavaScript template literals, not shell expansions.
          # shellcheck disable=SC2016
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const files = ["npm/tokfold/package.json"].concat(
              fs.readdirSync("npm/platforms").sort().map((d) => `npm/platforms/${d}/package.json`),
            );
            let bad = false;
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if ("scripts" in pkg) {
                console.log(`::error::${file} declares scripts: ${Object.keys(pkg.scripts).join(", ")}`);
                bad = true;
              }
            }
            if (bad) process.exit(1);
            console.log(`None of the ${files.length} manifests declares a lifecycle script.`);
          '

  # ---------------------------------------------------------------------------
  # Build. One optimised binary per target.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.dir }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # Publishing needs all five. Cancelling siblings on the first failure only
      # hides whether the others would also have failed.
      fail-fast: false
      # Three keys and no more. Whether a leg is native, and whether it needs an
      # emulator, used to be matrix keys too -- and a matrix key is a thing a
      # future edit can rename, misspell or drop, which is how a smoke test
      # stops running without anyone deciding it should. Both are now derived
      # from `target` inside the step that would fail if the derivation were
      # wrong. See "Smoke-test the binary" below.
      matrix:
        include:
          - dir: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - dir: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          # Linux legs build on 22.04 rather than latest on purpose. A glibc
          # binary runs on the glibc it was built against or newer, never older,
          # so the build image's glibc becomes the floor for every user. 24.04
          # would raise that floor to 2.39 and break Debian 12 and every
          # still-supported enterprise distro for no gain.
          - dir: linux-x64-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - dir: linux-arm64-gnu
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          # `windows-x64`, not Node's `win32-x64`: the registry refused the
          # latter as spam twice. The launcher's table still keys on `win32-x64`
          # because that is what `process.platform` reports; see the comment on
          # `PACKAGES` in npm/tokfold/lib/resolve.js.
          - dir: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        # Release binaries are built on stable, not on the 1.85 MSRV floor. MSRV
        # is a promise to people compiling the crate themselves; a binary we ship
        # should get current codegen.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
          rustup target add "$TARGET"
          rustc --version

      - name: Install the aarch64 cross toolchain and emulator
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # rustc emits aarch64 objects on its own; it still needs a linker that
        # can produce an aarch64 ELF, which the host gcc cannot.
        #
        # libc6-dev-arm64-cross is named explicitly because gcc-aarch64-linux-gnu
        # only *recommends* it, and --no-install-recommends is on. Without it the
        # cross linker exists but the aarch64 C startup objects do not, and the
        # link fails on `cannot find Scrt1.o`. Recommends are still off on
        # purpose: the packages we do need are cheap, the rest are not.
        #
        # qemu-user-static is what turns this leg from "compiled, never run"
        # into a smoke-tested one. The static build is chosen so the emulator
        # itself needs nothing from the sysroot it is about to point at.
        #
        # libgcc-s1-arm64-cross is named for the same reason as the libc: the
        # binary needs libgcc_s.so.1 at *run* time for unwinding, and nothing in
        # the link step would notice its absence.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libgcc-s1-arm64-cross \
            qemu-user-static

          # These three are what `qemu-aarch64-static -L /usr/aarch64-linux-gnu`
          # will need to start the binary at all, and the earlier check here --
          # for the C startup object -- was not one of them: a missing Scrt1.o
          # fails the link, loudly, naming the file. A missing loader or libc
          # fails the smoke test instead, and what it prints is
          # "No such file or directory" about a path that exists. Check the
          # things whose absence would otherwise be misreported.
          for lib in ld-linux-aarch64.so.1 libc.so.6 libgcc_s.so.1; do
            find /usr/aarch64-linux-gnu -name "$lib" -print -quit | grep -q . \
              || { echo "aarch64 sysroot has no $lib" >&2; exit 1; }
          done
          qemu-aarch64-static --version | head -1

      # Unlike ci.yml, there is no build cache here, and adding one back would
      # quietly undo the attestation the publish job pays for. `--locked` pins
      # which dependency *versions* resolve; it says nothing about where a
      # compiled `.rlib` came from. A restored cache entry was produced by an
      # earlier run, from a tree nothing in this run can see, yet the provenance
      # signature would still read "built from commit X" while covering a binary
      # partly made of code no attestation covers. This repository has already
      # been bitten once by a stale artifact outliving the sources it claimed to
      # be built from. Release builds are cold, every time. The cost is a few
      # minutes on a workflow that runs a handful of times a year.
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          # Both overrides are passed as one-off `--config` rather than written
          # into the committed Cargo.toml: each is a property of the binaries we
          # hand to users, not of the tree everyone else builds locally.
          #
          # `strip` because a developer's backtraces should keep their symbols
          # while a shipped binary has no use for them. It cuts several
          # megabytes per platform.
          #
          # `crt-static` because rustc does not enable it on the MSVC target --
          # `rustc --print cfg --target x86_64-pc-windows-msvc` lists no
          # `crt-static` feature, so the C runtime is linked dynamically and the
          # published `tokfold.exe` would need `VCRUNTIME140.dll`, which is part
          # of the Visual C++ Redistributable and not of Windows. That is a
          # machine-dependent failure at first run, with a message naming a DLL
          # rather than tokfold, on a binary a user installed from npm without
          # ever being told a C++ toolchain was involved. Static is also what
          # this ecosystem already does: node-gyp builds addons `/MT`, and the
          # napi-rs template and swc both set this same flag.
          #
          # Scoped to the one target on purpose. As a `[target.<triple>]` entry
          # it does not reach build scripts or proc macros, which are host
          # artefacts and which `crt-static` in a bare RUSTFLAGS would break.
          # On the other four targets the line is simply inert.
          cargo build \
            --package tokfold-cli \
            --release \
            --locked \
            --target "$TARGET" \
            --config 'profile.release.strip="symbols"' \
            --config 'target.x86_64-pc-windows-msvc.rustflags=["-C","target-feature=+crt-static"]'

      - name: Smoke-test the binary
        # No `if:`. The previous version of this step was gated on
        # `matrix.native || matrix.emulator != ''`, which made "was this binary
        # ever executed" a property of two matrix keys: rename either one and
        # every leg silently stops being smoke-tested while the run stays green
        # and publishes anyway. That is not hypothetical here -- the aarch64
        # binary already on the registry was published by a run in which this
        # step did not execute.
        #
        # So the default is now "run it", the exceptions are named by target,
        # and the step records what it did. The Stage step below refuses to
        # stage a binary this step did not write a verdict for, which is what
        # makes re-adding a condition fail loudly instead of quietly.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe="target/$TARGET/release/tokfold"
          [ "${RUNNER_OS}" = "Windows" ] && exe="$exe.exe"

          # Derived from the target rather than carried in the matrix, for the
          # same reason the `if:` is gone: this is the only place that knows
          # which targets this runner cannot execute unaided, and it is the
          # place that fails if it is wrong.
          emulator=""
          case "$TARGET" in
            aarch64-unknown-linux-gnu)
              # Not native, but not unrunnable either -- qemu-user executes the
              # aarch64 binary on this x86-64 runner, so this leg is smoke-tested
              # like the rest instead of being published untested, which is what
              # it used to be. `-L` points at the cross sysroot the toolchain
              # step installs, so the aarch64 loader and libc resolve from there.
              # Emulating explicitly rather than relying on binfmt_misc keeps
              # this independent of whether the runner image has the handlers
              # registered.
              emulator="qemu-aarch64-static -L /usr/aarch64-linux-gnu"
              ;;
            x86_64-apple-darwin)
              # The macOS runners are arm64 and Rosetta 2 is not guaranteed to
              # be installed on them, so this is the one binary that ships
              # unexecuted. Recorded rather than skipped in silence.
              echo "not executed: no x86_64 macOS runner and Rosetta 2 is not guaranteed" \
                > "smoke-$TARGET.verdict"
              echo "::warning::$TARGET is published without having been executed in CI"
              exit 0
              ;;
          esac

          # Word splitting is the point: `emulator` is either nothing at all or
          # a command followed by flags, and quoting it would turn the latter
          # into one impossible filename. Everything after it stays quoted.
          # shellcheck disable=SC2086
          tokfold() { $emulator "$exe" "$@"; }

          tokfold --version
          # Exercise the real path, not just --version: compress a document and
          # confirm the round trip returns the original value tree.
          printf '{"a":[{"x":1,"y":2},{"x":3,"y":4}]}' > sample.json
          tokfold compress --input sample.json --archive sample.tkfd > rendering.txt
          tokfold expand --input sample.tkfd > restored.json
          cmp sample.json restored.json

          verdict="round trip verified on $TARGET${emulator:+ (under $emulator)}"
          echo "$verdict" > "smoke-$TARGET.verdict"
          echo "$verdict"

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail

          # The smoke step's verdict, or nothing was staged. A binary reaching a
          # tarball without this file means the step above did not run for it,
          # and the whole point of the step is that a published binary has been
          # executed or is on a written list of the ones that could not be.
          verdict="smoke-$TARGET.verdict"
          if [ ! -f "$verdict" ]; then
            echo "no smoke-test verdict for $TARGET: the smoke step did not run" >&2
            exit 1
          fi
          echo "smoke test says: $(cat "$verdict")"

          src="target/$TARGET/release/tokfold"
          dst="npm/platforms/$DIR/bin/tokfold"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            src="$src.exe"
            dst="$dst.exe"
          fi
          mkdir -p "npm/platforms/$DIR/bin"
          cp "$src" "$dst"
          chmod +x "$dst"
          ls -l "$dst"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.dir }}
          path: npm/platforms/${{ matrix.dir }}/bin/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish. Platform packages first, launcher last.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # The only job that mints an OIDC token. npm provenance exchanges it for a
    # signed attestation tying each tarball to this workflow, this commit and
    # this runner; nothing else in this file has a use for it. A job-level block
    # replaces the workflow default rather than adding to it, which is why
    # `contents: read` is restated -- without it the checkout below cannot read
    # the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # Writes an .npmrc pointing at the public registry and reading the
          # token from NODE_AUTH_TOKEN, so the token never appears in a command
          # line where it could reach a process listing or a log.
          registry-url: "https://registry.npmjs.org"

      - name: Download every binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: staging

      - name: Place the binaries
        run: |
          set -euo pipefail
          for dir in npm/platforms/*/; do
            name="$(basename "$dir")"
            mkdir -p "$dir/bin"
            cp -a "staging/binary-$name/." "$dir/bin/"
          done
          # An empty platform package installs cleanly and then fails at the
          # moment the user runs the command, which is the worst place to find
          # out. Refuse to go further unless all five binaries are present and
          # non-empty.
          missing=0
          for dir in npm/platforms/*/; do
            name="$(basename "$dir")"
            exe="$dir/bin/tokfold"
            # A prefix rather than the one directory name, so adding
            # `windows-arm64` later does not silently look for an extensionless
            # file and report the package as empty.
            case "$name" in windows-*) exe="$exe.exe" ;; esac
            if [ ! -s "$exe" ]; then
              echo "::error::$exe is missing or empty"
              missing=1
            else
              chmod +x "$exe"
              printf '%-20s %s bytes\n' "$name" "$(wc -c < "$exe")"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Stage the licences
        # Every package is published as "MIT OR Apache-2.0", and both licences
        # require their text to travel with the distribution. The repository keeps
        # exactly one copy of each at the root, and the crates reach them through
        # symlinks -- which works there because cargo follows a symlink when it
        # builds a .crate.
        #
        # npm does not. `npm pack` omits symlinks silently: no warning, no error,
        # just a tarball that is missing the files listed in `files`. That is why
        # the copy happens here instead of a link living in the tree -- one
        # canonical text at the root, no duplicates to drift, and a real file in
        # every tarball.
        run: |
          set -euo pipefail
          for dir in npm/tokfold npm/platforms/*/; do
            cp LICENSE-MIT LICENSE-APACHE "$dir"
          done
          # Assert rather than assume, because the failure this guards against is
          # the silent one: a package that publishes fine and is simply missing
          # its licence.
          missing=0
          for dir in npm/tokfold npm/platforms/*/; do
            for name in LICENSE-MIT LICENSE-APACHE; do
              if [ ! -f "$dir/$name" ] || [ ! -s "$dir/$name" ] || [ -L "$dir/$name" ]; then
                echo "::error::$dir/$name is missing, empty, or still a symlink"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ]
          echo "Licence texts staged into all six packages."

      - name: End-to-end test through the launcher
        # The last check before anything leaves the runner, and the only one that
        # exercises the shipped launcher rather than the binary directly. It
        # builds the exact node_modules layout npm produces -- launcher plus one
        # platform package -- and runs the `tokfold` command through it, so a
        # broken resolve path, a lost exit code or a missing executable bit is
        # caught here rather than by the first person to install it.
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/node_modules"
          cp -a npm/tokfold "$root/node_modules/tokfold"
          cp -a npm/platforms/linux-x64-gnu "$root/node_modules/tokfold-linux-x64-gnu"

          run() { node "$root/node_modules/tokfold/bin/tokfold" "$@"; }

          run --version

          # Exit code 0 and a real round trip.
          printf '{"k":[{"a":1,"b":2},{"a":3,"b":4}]}' > in.json
          run compress --input in.json --archive out.tkfd > /dev/null
          run expand --input out.tkfd > back.json
          cmp in.json back.json
          echo "round trip through the launcher: ok"

          # Exit code 3: a corrupt archive must stay 3 after crossing the wrapper.
          printf 'not an archive at all' > bad.tkfd
          set +e
          run expand --input bad.tkfd > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::corrupt archive returned $code through the launcher, expected 3"
            exit 1
          fi
          echo "exit code 3 preserved through the launcher: ok"

          # Exit code 2: input the compressor rejects.
          printf 'this is not json' > bad.json
          set +e
          run stats --input bad.json > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::rejected input returned $code through the launcher, expected 2"
            exit 1
          fi
          echo "exit code 2 preserved through the launcher: ok"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Everything after the @ in `npm view "pkg@$VERSION"` is parsed as a
          # semver RANGE, never as a literal. `pkg@` and `pkg@^4.0.0` both
          # resolve, and so does a one- or two-component `pkg@1`, which means
          # "newest 1.x" -- so a version of the wrong shape silently turns the
          # lookups below into questions about a different release. The
          # "Versions agree" job already rejects anything that is not the
          # version in the tree, but that is a different job: a guard sitting
          # away from the code it guards is one refactor from being gone, and
          # the code it guards here is the code that decides whether to upload.
          #
          # Prerelease suffixes are refused rather than parsed. Nothing in this
          # repository has ever shipped one, and accepting them means reasoning
          # about npm's range grammar again -- do that deliberately, not by
          # loosening a regex.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a literal x.y.z release, not a range or a prerelease; got '$VERSION'."
            exit 1
          fi

          # Provenance is only meaningful on a real upload -- it signs a tarball
          # that is actually being stored -- so a dry run omits the flag rather
          # than asking the registry to attest to something it will never see.
          #
          # `--ignore-scripts` because publishing executes the package's own
          # lifecycle scripts, in this job, with the release token in the
          # environment. The verify job proves none of the six manifests has a
          # `scripts` block, so this flag changes nothing today. That is the
          # point of it: it is the half that still holds if the other half is
          # ever edited away.
          flags="--access public --ignore-scripts"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
            echo "DRY RUN -- nothing will be uploaded."
          else
            flags="$flags --provenance"
            echo "PUBLISHING $VERSION for real."
          fi

          # Which account this run is authenticated as, resolved once here
          # rather than six times in the loop. It is half of the skip decision
          # below, and on a real publish it must exist: a run that cannot say
          # who it is has no business deciding that a name already belongs to
          # us, so `set -e` stopping here is the correct outcome.
          publisher=""
          if [ "$DRY_RUN" = "true" ]; then
            # A rehearsal may be started without NPM_TOKEN in scope. That must
            # not fail the run -- but it does mean the ownership question cannot
            # be answered, so say so loudly rather than printing a verdict the
            # run did not actually reach.
            publisher="$(npm whoami 2>/dev/null || true)"
            if [ -z "$publisher" ]; then
              echo "npm whoami found no registry auth -- ownership cannot be checked in this run."
              echo "The rehearsal below falls back to a bare existence check and says so per package."
            else
              echo "Authenticated as: $publisher"
            fi
          else
            # This is also the first command in the whole workflow that uses the
            # token, so it is where a missing or expired one surfaces -- and what
            # it prints is an `ENEEDAUTH` or `E401` that names no secret and no
            # repository. Say which knob to turn before `set -e` ends the run.
            echo "Resolving the publishing account; this is the first use of NPM_TOKEN."
            echo "If it fails with ENEEDAUTH or E401, the repository secret NPM_TOKEN is"
            echo "missing, expired, or not an automation token with publish rights."
            publisher="$(npm whoami)"
            echo "Authenticated as: $publisher"
          fi

          # A version already on the registry is treated as done, not as an
          # error. Publishing six packages is six uploads that can fail
          # independently -- a network blip or a registry rejection on the
          # fourth leaves the first three published and unpublishable again,
          # because npm never lets a version be reused. Without this check the
          # only way out of a partial release would be to burn a version
          # number. With it, re-running the workflow converges on the intended
          # state instead of deadlocking on the work it already did.
          #
          # "Already there" is not the same question as "already ours", and only
          # the second one is safe to skip on. These names are public and some
          # of them are still unclaimed, so a squatter who publishes one first
          # would otherwise turn this into a workflow that reports success
          # having uploaded nothing, while `npm i -g tokfold` runs their code.
          # Hence `_npmUser.name`: equal to us means done, anything else -- a
          # different account, or a registry that will not say -- means stop,
          # because whatever is under that name at that version is not ours and
          # never becomes ours by continuing.
          #
          # A lookup that fails for any other reason (network, registry outage,
          # rate limit) exits non-zero too and therefore lands on "publish",
          # where npm itself rejects a duplicate version. That direction is the
          # safe one: the cost of trying is an error, the cost of wrongly
          # skipping is a release that silently did not happen.

          # `npm view` answers two different questions with the same exit code.
          # `E404` is a real answer -- that name at that version is not on the
          # registry -- while a timeout, a 5xx or a rate limit is no answer at
          # all, and both come back as 1. Separating them is worth the code
          # because they deserve opposite treatment: E404 is final and must not
          # be retried, and everything else is worth asking again before falling
          # through to a publish that will fail the run and take every package
          # after it down too.
          #
          # Exit 0 prints the publisher (possibly empty). Exit 1 is "not on the
          # registry". Exit 2 is "the registry did not answer".
          lookup_owner() {
            local name="$1" attempt=1 errors out
            errors="$(mktemp)"
            while :; do
              if out="$(npm view "$name@$VERSION" _npmUser.name 2>"$errors")"; then
                rm -f "$errors"
                printf '%s' "$out"
                return 0
              fi
              if grep -q 'E404' "$errors"; then
                rm -f "$errors"
                return 1
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "npm view $name@$VERSION failed $attempt times:" >&2
                cat "$errors" >&2
                rm -f "$errors"
                return 2
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          publish_one() {
            local dir="$1" name owner skip=no reason="" found=0
            name="$(node -p "require('./$dir/package.json').name")"
            echo "=== $name ==="

            owner="$(lookup_owner "$name")" || found=$?

            if [ "$found" -eq 2 ]; then
              # Three failures is not evidence of anything about the name, so
              # this deliberately does not skip. Publishing is the safe guess:
              # if the version does exist, npm refuses the upload and the run
              # fails loudly; if it does not, the release proceeds as intended.
              echo "the registry did not answer after 3 tries -- attempting the publish anyway"
            elif [ "$found" -eq 0 ]; then
              if [ -z "$publisher" ]; then
                skip=yes
                reason="already on the registry; publisher NOT verified (no npm auth in this run)"
              elif [ -z "$owner" ]; then
                # The registry answered, and the answer contained no publisher.
                # That is not "someone else owns this" -- it is "this registry
                # will not say who owns it", which happens with an unpublished
                # version left as a tombstone, a mirror that strips the field,
                # or a package whose metadata predates it. Distinguishing the
                # two changes nothing about what happens next, and everything
                # about what the person reading the log goes and checks.
                echo "::error::$name@$VERSION exists on the registry, but it reports no publisher at all."
                echo "::error::Ownership cannot be established, so it cannot be treated as ours. Stopping the whole release."
                exit 1
              elif [ "$owner" = "$publisher" ]; then
                skip=yes
                reason="already published by $publisher"
              else
                echo "::error::$name@$VERSION is already on the registry, published by '$owner', not by '$publisher'."
                echo "::error::That name at that version is not under our control. Stopping the whole release."
                # Not `return 1`: the remaining packages must not be uploaded
                # either. A release that found someone else holding one of its
                # names is over, not partially continuable.
                exit 1
              fi
            fi

            # The dry run answers the same question against the same registry
            # and then packs anyway. Rehearsing the decision is the point --
            # this is the most fragile code in the file and it used to be
            # skipped entirely when DRY_RUN was true, which is precisely how it
            # reached the live registry unexercised -- but packing all six is
            # what makes a dry run worth running, so the verdict is printed
            # rather than acted on.
            if [ "$DRY_RUN" = "true" ]; then
              if [ "$skip" = "yes" ]; then
                echo "would skip -- $reason"
              else
                echo "would publish -- $name@$VERSION is not on the registry"
              fi
            elif [ "$skip" = "yes" ]; then
              echo "skipping -- $reason"
              return 0
            fi

            # shellcheck disable=SC2086
            ( cd "$dir" && npm publish $flags )
          }

          # Order matters. The launcher's optionalDependencies name versions that
          # must already exist: publish it first and there is a window in which
          # `npm i -g tokfold` installs a launcher whose binary package cannot be
          # resolved. Platform packages first, launcher last, means the only
          # visible states are "not yet released" and "released and working".
          for dir in npm/platforms/*/; do
            publish_one "${dir%/}"
          done

          publish_one npm/tokfold

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run complete"
              echo ""
              echo "Nothing was uploaded. All five binaries built, staged and packed, and the"
              echo "launcher passed the end-to-end test including exit codes 2 and 3."
              echo ""
              echo "To publish for real: run this workflow again with \`dry_run\` unchecked and"
              echo "\`confirm\` set to \`PUBLISH\`."
            else
              echo "## Published \`$VERSION\`"
              echo ""
              echo '```'
              echo "npm install -g tokfold@$VERSION"
              echo '```'
              echo ""
              echo "Six packages: the \`tokfold\` launcher and five platform binaries."
              echo "npm versions cannot be reused and unpublish is limited to 72 hours."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
