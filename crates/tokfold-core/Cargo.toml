[package]
name = "tokfold-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reversible, structure-aware context compression engine for LLM agents (core)"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
sha2.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
# Reserved, not implemented in v0.0.1. See docs: exact tokenizers pull megabytes
# of BPE data and must never be enabled by default.
tiktoken = []
hf = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
