[package]
name = "tokfold-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reversible, structure-aware context compression engine for LLM agents (core)"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
# A published crate must carry its own README and licence texts: `cargo package`
# cannot reach outside the package root, so a file at the workspace root is not
# shipped. LICENSE-MIT and LICENSE-APACHE here are symlinks to the workspace-root
# texts (cargo dereferences them into the .crate tarball), which keeps one copy
# of each licence in the tree.
readme = "README.md"
documentation = "https://docs.rs/tokfold-core"
# Ship an explicit allow list rather than letting `cargo package` sweep up
# whatever happens to be sitting in the crate directory. Everything the crate
# needs to build and to be tested from the tarball is named here; anything else
# (editor droppings, scratch files, local benchmark corpora) is excluded by
# omission. `tests/**/*` is deliberate: the proptest regression seeds only stop
# regressions if they travel with the sources.
include = [
    "src/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
sha2.workspace = true
rustc-hash.workspace = true
tiktoken-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = []
# `tiktoken` links exact GPT tokenizers (cl100k_base = id 2, o200k_base = id 3) for
# the do-no-harm gate — see `estimator::Cl100kEstimator`. Exact tokenizers pull
# megabytes of embedded BPE data, so this is opt-in and must never be enabled by
# default. `hf` is reserved and not implemented in v0.0.1.
tiktoken = ["dep:tiktoken-rs"]
hf = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
